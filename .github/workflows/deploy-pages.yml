name: Deploy AeglysAI Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant only the permissions each job needs.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned offline contract validators
        run: |
          python3 -m venv .community-drafts/contract-venv
          .community-drafts/contract-venv/bin/python -m pip install -r scripts/community/upstream/scripts/community/requirements.txt

      - name: Check types
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify generated site
        run: npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    # Manual runs from other branches may build, but cannot publish production.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
