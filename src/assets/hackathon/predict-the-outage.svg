<title id="predict-the-outage-title">Predict the Outage: conceptual architecture</title>
<desc id="predict-the-outage-description">System metrics including CPU, latency and errors to pattern analysis to risk prediction to an early warning. No actual prediction or proprietary algorithm.</desc>
