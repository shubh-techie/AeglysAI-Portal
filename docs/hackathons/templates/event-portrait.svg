<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Unapproved event announcement design template — portrait</title>
  <desc id="desc">Editable layout only. Replace bracketed fields with approved public information. No partnership or publication approval implied.</desc>
  <rect width="1080" height="1350" fill="#080f1c"/>
  <rect x="80" y="80" width="920" height="1190" rx="24" fill="#0d1727" stroke="#64e1ed" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" fill="#edf2f5">
    <text x="112" y="144" font-size="26" fill="#64e1ed">[EVENT NAME]</text>
    <text x="112" y="208" font-size="30">[VERIFIED ROLE / CATEGORY]</text>
    <text x="112" y="294" font-size="40">[APPROVED DISPLAY NAME]</text>
    <text x="112" y="354" font-size="26">[APPROVED COPY — WRAP MANUALLY]</text>
    <text x="112" y="1158" font-size="24">[APPROVED PUBLIC URL / DATE]</text>
    <text x="112" y="1222" font-size="22" fill="#64e1ed">DESIGN TEMPLATE · NOT APPROVED FOR PUBLICATION</text>
  </g>
</svg>
