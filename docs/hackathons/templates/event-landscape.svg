<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Unapproved event announcement design template — landscape</title>
  <desc id="desc">Editable layout only. Replace bracketed fields with approved public information. No partnership or publication approval implied.</desc>
  <rect width="1200" height="675" fill="#080f1c"/>
  <rect x="64" y="64" width="1072" height="547" rx="24" fill="#0d1727" stroke="#64e1ed" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" fill="#edf2f5">
    <text x="96" y="128" font-size="26" fill="#64e1ed">[EVENT NAME]</text>
    <text x="96" y="192" font-size="30">[VERIFIED ROLE / CATEGORY]</text>
    <text x="96" y="278" font-size="40">[APPROVED DISPLAY NAME]</text>
    <text x="96" y="338" font-size="26">[APPROVED COPY — WRAP MANUALLY]</text>
    <text x="96" y="499" font-size="24">[APPROVED PUBLIC URL / DATE]</text>
    <text x="96" y="563" font-size="22" fill="#64e1ed">DESIGN TEMPLATE · NOT APPROVED FOR PUBLICATION</text>
  </g>
</svg>
